<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>Mx. Voice - Profiles</title>

  <!-- Same stylesheets as the main window; the picker itself is shared with
       the Switch Profile dialog (renderer/modules/profile-picker) -->
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="stylesheets/fonts.css">
  <link rel="stylesheet" href="stylesheets/index.css">
  <link rel="stylesheet" href="stylesheets/colors.css">
  <link rel="stylesheet" href="stylesheets/profile-picker.css">

  <style>
    /* The picker fills the window: dialog parts without the dialog frame */
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: var(--panel-color);
    }

    .launcher-modal {
      height: 100%;
    }

    .launcher-modal .modal-dialog {
      margin: 0;
      max-width: none;
      height: 100%;
    }

    .launcher-modal .modal-content {
      height: 100%;
      border: 0;
      border-radius: 0;
    }

    .launcher-modal .modal-header {
      -webkit-app-region: drag;
    }

    .launcher-modal .modal-header button {
      -webkit-app-region: no-drag;
    }

    /* Clear the macOS traffic lights over the header */
    body.has-titlebar .launcher-modal .modal-header {
      padding-top: 32px;
    }

    .launcher-modal .profile-picker-body {
      flex: 1 1 auto;
    }
  </style>
</head>
<body>
  <div class="modal position-static d-block launcher-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" id="picker-root"></div>
    </div>
  </div>

  <script type="module" src="launcher.js"></script>
</body>
</html>
